<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Google</title>
</head>
<body>
    <div class="parent">
        <div class="navbar">
            <div class="navbar-left">
                <a class="about" href="https://about.google/?fg=1&utm_source=google-US&utm_medium=referral&utm_campaign=hp-header">
                    About
                </a>
                <a class="store" href="https://store.google.com/US?utm_source=hp_header&utm_medium=google_ooo&utm_campaign=GS100042&hl=en-US">
                    Store
                </a>
            </div>
            <div class="navbar-right">
                <a class="gmail" href="https://mail.google.com/mail/&ogbl">
                    Gmail
                </a>
                <a class="images" href="https://www.google.com/imghp?hl=en&ogbl">
                    Images
                </a>
                <a class="apps" href="https://www.google.com/intl/en/about/products">
                    <img src="./assets/Smiley face.png" height="30px" width="30px"/>
                </a>
                <a class="account" href="https://accounts.google.com/SignOutOptions?hl=en&continue=https://www.google.com/&ec=futura_exp_og_si_72776762_e">
                    <img src="./assets/Account.png" height="30px" width="30px"/>
                </a>
            </div>
        </div>
        <div class="main">
            <div class="searchbar">
                <input id="search-input" type="search" name="q" placeholder="Search Anything">
                <button id="google-search-button" type="submit">Google Search</button>
            </div>
        </div>
        <div class="footer">
            <div class="footer-left">
                <a class="advertising" href="https://www.google.com/intl/en_us/ads/?subid=ww-ww-et-g-awa-a-g_hpafoot1_1!o2&utm_source=google.com&utm_medium=referral&utm_campaign=google_hpafooter&fg=1">
                    Advertising
                </a>
                <a class="business" href="https://www.google.com/services/?subid=ww-ww-et-g-awa-a-g_hpbfoot1_1!o2&utm_source=google.com&utm_medium=referral&utm_campaign=google_hpbfooter&fg=1">
                    Business
                </a>
                <a class="howsearchworks" href="https://google.com/search/howsearchworks/?fg=1">
                    How Search Works
                </a>
            </div>
            <div class="footer-middle">
                <a class="applying-ai" href="https://ai.google/societal-impact/?utm_source=googlehpfooter&utm_medium=housepromos&utm_campaign=bottom-footer">
                    Applying AI towards science and the environment
                </a>
            </div>
            <div class="footer-right">
                <a class="privacy" href="https://policies.google.com/terms?hl=en&fg=1">
                    Privacy
                </a>
                <a class="terms" href="https://policies.google.com/terms?hl=en&fg=1">
                    Terms
                </a>
                <a class="settings" href="https://www.google.com/preferences?hl=en&prev=https://www.google.com/">
                    Settings
                </a>
            </div>
        </div>
    </div>
    <script defer src="./search.js"></script>
</body>
</html>
